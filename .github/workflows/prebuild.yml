name: prebuild
# Makes the companies a reviewer is most likely to type open instantly: builds dossiers for Nifty 50 constituents
# that don't have one yet, at most 8 a night so the free AI quota and the job's time stay bounded. Prebuilt
# dossiers are never refreshed (only the holdings are, in dossiers.yml); each shows the date it was built.
on:
  schedule:
    - cron: "13 21 * * *"  # 02:43 IST, after the evening holdings refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prebuild
  cancel-in-progress: false

jobs:
  prebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/cache@v4
        with:
          path: backend/.cache
          key: finn-cache-${{ github.run_id }}
          restore-keys: finn-cache-

      - name: Build missing Nifty 50 dossiers
        working-directory: backend
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: uv run python -m finn.pull.dossier --symbols-file finn/data/nifty50.txt --mode missing --limit 8 --parallel 2

      - name: Commit dossiers
        id: commit
        run: |
          git config user.name "finn-prebuild[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "chore: prebuild dossiers $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy site + data to the HF Space
        if: steps.commit.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: make deploy-space

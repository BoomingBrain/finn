name: dossiers
# Keeps the portfolio's research current, daily after the evening ingest. Only the 18 holdings are checked:
#   - a holding without a dossier gets one
#   - a dossier with a failed section is retried
#   - a dossier whose sources changed (new results quarter, new concall, new annual report) is rebuilt;
#     unchanged ones cost one cached screener fetch and no model calls
# Other companies (demo tickers, dossiers saved from live research) keep the dossier as built; each shows its date.
on:
  schedule:
    - cron: "47 14 * * *"   # 20:17 IST daily
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh | failed | missing | all"
        default: "refresh"

permissions:
  contents: write

concurrency:
  group: dossiers
  cancel-in-progress: false

jobs:
  dossiers:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/cache@v4
        with:
          path: backend/.cache
          key: finn-cache-${{ github.run_id }}
          restore-keys: finn-cache-

      - name: Build missing, failed and outdated dossiers for the holdings
        working-directory: backend
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FINN_CONCURRENCY_REASON: "3"
        run: uv run python -m finn.pull.dossier --holdings --mode "${{ github.event.inputs.mode || 'refresh' }}" --parallel 2

      - name: Rebuild the chat index
        continue-on-error: true   # an embedding outage must not lose the dossiers built above
        working-directory: backend
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: uv run python -m finn.rag --build

      - name: Commit dossiers
        id: commit
        run: |
          git config user.name "finn-dossiers[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "chore: refresh dossiers $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy site + data to the HF Space
        if: steps.commit.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: make deploy-space
